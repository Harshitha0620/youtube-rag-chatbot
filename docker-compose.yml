services:

  api:
    build: .
    container_name: youtube_rag_api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MYSQL_HOST: host.docker.internal

    volumes:
      - ./data:/app/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"


  streamlit:
    build: .

    container_name: youtube_rag_streamlit

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    volumes:
      - ./data:/app/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - api

    command:
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501